<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Hyperspace</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <canvas id="gameCanvas" width="711" height="400"></canvas>
        <main id="authScreen" class="auth-screen">
            <section class="auth-card" aria-labelledby="authTitle">
                <p class="auth-eyebrow">SPACE ARCADE</p>
                <h1 id="authTitle">Welcome back</h1>
                <p id="authDescription" class="auth-description">Sign in to continue your mission.</p>

                <form id="loginForm" class="auth-form">
                    <label for="loginUsername">Username</label>
                    <input id="loginUsername" name="username" type="text" autocomplete="username" minlength="3" required>
                    <label for="loginPassword">Password</label>
                    <div class="password-field">
                        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" data-password-target="loginPassword" aria-label="Show password" aria-pressed="false" title="Show password">
                            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                                <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z" fill="currentColor"/>
                                <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
                            </svg>
                                                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" hidden>
                                <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z" fill="currentColor"/>
                                <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
                                <line x1="4.5" y1="3.5" x2="20" y2="20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <button type="submit">Log in</button>
                    <p class="auth-switch">New pilot? <button type="button" class="text-button" data-auth-view="register">Create an account</button></p>
                </form>

                <form id="registerForm" class="auth-form" hidden>
                    <label for="registerUsername">Username</label>
                    <input id="registerUsername" name="username" type="text" autocomplete="username" minlength="3" maxlength="24" required>
                    <label for="registerPassword">Password</label>
                    <div class="password-field">
                        <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="password-toggle" data-password-target="registerPassword" aria-label="Show password" aria-pressed="false" title="Show password">
                            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                                <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z" fill="currentColor"/>
                                <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
                            </svg>
                                                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" hidden>
                                <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z" fill="currentColor"/>
                                <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
                                <line x1="4.5" y1="3.5" x2="20" y2="20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-field">
                        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="password-toggle" data-password-target="confirmPassword" aria-label="Show password" aria-pressed="false" title="Show password">
                            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                                <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z" fill="currentColor"/>
                                <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
                            </svg>
                                                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" hidden>
                                <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z" fill="currentColor"/>
                                <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
                                <line x1="4.5" y1="3.5" x2="20" y2="20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <button type="submit">Create account</button>
                    <p class="auth-switch">Already have an account? <button type="button" class="text-button" data-auth-view="login">Log in</button></p>
                </form>

                <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
                <p class="auth-note">Accounts are stored on the game server, so your progress follows you on every device that runs it. Old demo accounts are moved over automatically when you sign in once.</p>
            </section>
        </main>
        <aside id="accountControls" class="account-controls" hidden>
            <span id="accountName"></span>
            <button id="logoutButton" type="button">Sign out</button>
        </aside>
        <audio id="bgMusic" src="./mondamusic-retro-arcade-game-music-512837.mp3" loop preload="auto"></audio>
        <script src="script.js"></script>
    </body>
</html>
